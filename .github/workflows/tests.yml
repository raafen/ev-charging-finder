name: Test and publish live client

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: current-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - name: Unit and API behavior
        run: python -m unittest discover -s tests -v
      - name: Audit Python dependencies
        run: python -m pip_audit -r requirements-dev.txt
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Browser behavior on Flask and project-path Pages
        run: python -m unittest discover -s tests/browser -v
      - name: Owned JavaScript budget
        run: python -c "from pathlib import Path; n=sum(p.stat().st_size for p in Path('static').rglob('*.js')); print(f'Owned JavaScript {n} / 153600 bytes'); assert n <= 153600, 'Owned JavaScript exceeds 150 KiB budget'"
      - name: Export credential-free Pages client
        run: python scripts/build_pages.py --output site
      - name: Retain Pages build for review
        uses: actions/upload-artifact@v4
        with:
          name: pages-client
          path: site/
          include-hidden-files: true
      - name: Configure Pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/

  deploy-pages:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy live API client
        id: deployment
        uses: actions/deploy-pages@v4
