[project]
name = "current-ev-charging-finder"
version = "2.0.0"
description = "Local-first EV charging companion with a documented server-side API"
requires-python = ">=3.12,<3.15"
dependencies = [
  "Flask==3.1.3",
  "requests==2.34.2",
  "fastapi==0.146.0",
  "uvicorn==0.54.0",
  "httpx==0.28.1",
  "a2wsgi==1.10.10",
]

[tool.vercel]
entrypoint = "main:app"
